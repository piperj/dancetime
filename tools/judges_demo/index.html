<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Judges Scores Demo — Phase 3 (SPA card)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 1.5rem; }
  .heat-box { background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 0.75rem; max-width: 40rem; }
  .judges-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.25rem; }
  .judges-table th, .judges-table td { padding: 0.25rem 0.5rem; text-align: center; border-bottom: 1px solid #f0f0f0; }
  .judges-table th:nth-child(2), .judges-table td:nth-child(2) { text-align: left; }
  .judges-table th { color: #6b7280; font-weight: 600; }
</style>
</head>
<body>
  <h1 class="text-xl font-semibold mb-2">Judges Scores Demo — Phase 3</h1>
  <p class="text-sm text-gray-600 mb-4">
    Hardcoded fixture: CYI <strong>904</strong>, competitor
    <strong>Johan Piper</strong>, heat <strong>853</strong>.
    Fetches live from ndcapremier.com — no local/cached data used.
  </p>

  <div id="card">Loading…</div>

  <script src="/static/judges-scores.js"></script>
  <script>
    const CYI = 904;
    const COMPETITOR_NAME = 'Johan Piper';
    const HEAT_NUMBER = '853';

    JudgesScores.fetchJudgesData(CYI, COMPETITOR_NAME, HEAT_NUMBER)
      .then(event => {
        document.getElementById('card').innerHTML = JudgesScores.renderPanel(event);
      })
      .catch(err => {
        document.getElementById('card').textContent = `Error: ${err.message}`;
      });
  </script>
</body>
</html>
