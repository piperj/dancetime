  // ── Shared heat rendering ──────────────────────────────────────────────────
  function renderRoundEntries(heat) {
    const byEvent = {};
    heat.entries.forEach(e => { (byEvent[e.event] ??= []).push(e); });
    return Object.entries(byEvent).map(([evt, entries], idx) => {
      const someHaveResult = entries.some(e => e.result !== '');
      entries.sort((a, b) => {
        const ra = parseInt(a.result), rb = parseInt(b.result);
        const aAdv = isNaN(ra), bAdv = isNaN(rb);
        if (aAdv && bAdv) return 0;
        if (aAdv) return -1;
        if (bAdv) return 1;
        return ra - rb;
      });
      const rows = entries.map(e => {
        const r = parseInt(e.result);
        const advanced = isNaN(r) && someHaveResult;
        const medal = advanced ? '🥇' : rankPrefix(r);
        const rank = medal ? medal + ' ' : !isNaN(r) ? `${ordinal(r)} ` : '';
        return `<div>${rank}${esc(e.bib)} ${esc(e.couple)}</div>`;
      }).join('');
      let contested = '', judgesPanel = '';
      if (entries.length > 1) {
        const panelKey = `${heat.key}__${idx}`;
        const anchorName = entries[0].competitor1;
        contested = ` <span class="text-yellow-600 cursor-pointer hover:underline" onclick="toggleJudgesPanel(event, '${esc(panelKey)}', '${esc(anchorName)}', '${esc(heat.heat_number)}')">(Contested)</span>`;
        judgesPanel = renderJudgesPanel(panelKey);
      }
      return `<div class="mb-1"><strong>${esc(evt)}:</strong>${contested}<div class="ml-2">${rows}</div>${judgesPanel}</div>`;
    }).join('');
  }

  // Builds the panel's inner content from judgesDataCache, memoizing the
  // rendered HTML alongside the raw data so the 10s auto-refresh (which calls
  // this on every open panel every tick) doesn't re-render unchanged data.
  // Single source of truth — used both by the full-page render
  // (renderJudgesPanel) and by toggleJudgesPanel's direct DOM update after a
  // fetch, so the two never drift out of sync.
  function buildJudgesPanelContent(key) {
    const cached = judgesDataCache[key];
    if (!cached) return '';
    if (!cached.html) cached.html = JudgesScores.renderPanel(cached.data);
    return cached.html;
  }

  // Renders the (possibly-open) judges-scores panel slot for a Contested pill.
  // Re-run on every render (including the 10s auto-refresh), so it must restore
  // from judgesDataCache rather than relying on DOM state, which gets rebuilt.
  function renderJudgesPanel(key) {
    const isExpanded = expandedJudgesPanels.has(key);
    const content = isExpanded ? buildJudgesPanelContent(key) : '';
    return `<div id="jp-${esc(key)}" class="judges-panel${isExpanded ? ' expanded' : ''}" onclick="event.stopPropagation()">${content}</div>`;
  }

  function buildCouplesBadge(n) {
    return n === 1
      ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 ml-2">Solo on floor</span>'
      : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 ml-2">${n} couples</span>`;
  }

  function getHeatRounds(heatNumber, session, fallback) {
    const sorted = (heatsByNumber[heatNumber] || fallback)
      .filter(h => h.session === session)
      .sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
    return splitHeatRounds(sorted, fallback?.[0]?.key);
  }

  // Assumed length of a heat (s); the estimated times are start times, so we
  // subtract this to turn a start-to-start gap into actual rest between heats.
  const HEAT_DURATION_SEC = 90;

  // Rest (in minutes) between the end of one heat and the start of the next.
  function restMinutes(prevMainTime, nextStartTime) {
    return ((new Date(nextStartTime) - new Date(prevMainTime)) / 1000 - HEAT_DURATION_SEC) / 60;
  }

  // A break means the couple left the floor: one or more floor heats ran between
  // their two shown heats. Detected by a gap in global floor position — robust to
  // solos and other tracks that reuse or skip heat numbers.
  function heatsSkipped(prevKey, nextKey) {
    const a = floorPositionByKey[prevKey], b = floorPositionByKey[nextKey];
    return a != null && b != null && b - a > 1;
  }

  // Marker HTML to show before a heat when the couple has left the floor (a heat
  // was skipped, with a positive rest gap) and/or switched partner since their
  // previous shown heat. `partner`/`partnerChanged` are null/false for views that
  // don't track a partner (studio, bib, all-heats).
  // 'top' ceremonies (top student/teacher/studio, etc.) share the award styling
  // per product decision — only costume/floor breaks get the subtler treatment.
  function renderProgramActivity(a) {
    if (a.category === 'break')
      return `<div class="costume-marker">👗 ${esc(a.title)} — ${esc(formatTime(a.time))}</div>`;
    return `<div class="award-marker">🏆 ${esc(a.title)} — ${esc(formatTime(a.time))}</div>`;
  }

  function transitionMarker(prevKey, prevMainTime, next, partner, partnerChanged) {
    if (heatsSkipped(prevKey, next.key)) {
      const rest = restMinutes(prevMainTime, next.time);
      if (rest > 0) {
        const fmt = formatBreakTime(Math.round(rest));
        return partnerChanged && partner
          ? `<div class="partner-change-marker">🔄 ${esc(partner)} · ${fmt} rest</div>`
          : `<div class="break-marker">⏸️ Break · ${fmt} rest</div>`;
      }
    }
    if (partnerChanged && partner)
      return `<div class="partner-change-marker">🔄 ${esc(partner)}</div>`;
    return '';
  }

  // Solos are numbered independently and reuse regular heat numbers, so
  // (heat_number, session) can collide with an unrelated heat later in the day.
  // Real rounds of one physical heat always carry distinct round names
  // (Quarterfinal → Semifinal → Final); a repeated round name means a separate
  // heat. Partition on repeated round names so each physical heat is isolated.
  // Known gap: two same-kind heats that share a number (or an empty number) AND
  // the same single round name — e.g. cyi 1049's two "Best Of Best Dance Off"
  // finals — can't be told apart here and still collapse into one card.
  function partitionRounds(sorted) {
    const partitions = [];
    let cur = [], names = new Set();
    for (const h of sorted) {
      if (names.has(h.round)) { partitions.push(cur); cur = []; names = new Set(); }
      cur.push(h);
      names.add(h.round);
    }
    if (cur.length) partitions.push(cur);
    return partitions;
  }

  // Keep only the partition holding the anchor heat, so a colliding heat that
  // reuses this (heat_number, session) doesn't leak into its couple count or break.
  function splitHeatRounds(sorted, anchorKey) {
    const partitions = partitionRounds(sorted);
    return partitions.find(p => p.some(h => h.key === anchorKey)) || partitions[0] || sorted;
  }

  // All physical heats in `heats`, each as its time-sorted rounds, ordered by
  // start time. Records sharing (heat_number, session) are split by
  // partitionRounds so a solo heat reusing a regular number is its own heat.
  function partitionPhysical(heats) {
    const byNumSess = new Map();
    for (const h of heats) {
      const k = `${h.heat_number}|${h.session}`;
      let arr = byNumSess.get(k);
      if (!arr) byNumSess.set(k, arr = []);
      arr.push(h);
    }
    const physical = [];
    for (const group of byNumSess.values()) {
      const sorted = group.slice().sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
      for (const part of partitionRounds(sorted)) physical.push(part);
    }
    return physical.sort((a, b) => a[0].time < b[0].time ? -1 : a[0].time > b[0].time ? 1 : 0);
  }

  // One representative (earliest round) per physical heat, so a solo heat reusing
  // a regular heat number gets its own card instead of being deduped away.
  function dedupePhysicalHeats(heats) {
    return partitionPhysical(heats).map(part => part[0]);
  }

  // Assign every round key the global floor index of its physical heat, so views
  // can tell when heats were skipped between a couple's two shown heats. Caches
  // the full partition (heatsByKey is immutable after load) so renders can reuse
  // it instead of re-partitioning.
  function buildFloorPositions() {
    floorPositionByKey = {};
    allPhysicalHeats = partitionPhysical(Object.values(heatsByKey));
    allPhysicalHeats.forEach((part, i) =>
      part.forEach(h => { floorPositionByKey[h.key] = i; }));
  }

  function renderHeatDetails(allRounds) {
    return allRounds.map((heat, gi) => {
      const roundHeader = allRounds.length > 1
        ? `<div class="font-semibold text-gray-600 mb-1">${esc(heat.round)}</div>`
        : '';
      return (gi > 0 ? '<hr class="my-2 border-gray-200">' : '') + roundHeader + renderRoundEntries(heat);
    }).join('');
  }

  function renderHeatCard(primary, allRounds, eventName, extraBadge = '', judgesPanel = '') {
    const n = allRounds[allRounds.length - 1].entries.length;
    const groupKey = allRounds.map(h => h.key).join('-');
    const isExpanded = allRounds.some(h => expandedHeats.has(h.key)) || expandedHeats.has(groupKey);
    const roundLabel = allRounds.length === 1 ? `<div><strong>Round:</strong> ${esc(primary.round)}</div>` : '';
    return `<div class="heat-box" onclick="toggleHeatDetails('h-${groupKey}')">
      <div class="text-base text-gray-900">
        <strong>${esc(primary.heat_number)}</strong> · ${esc(formatTime(primary.time))} ${extraBadge} ${buildCouplesBadge(n)}
      </div>
      <div class="text-sm text-gray-700 mt-1">${esc(eventName)}</div>
      ${judgesPanel}
      <div id="h-${groupKey}" class="heat-details${isExpanded ? ' expanded' : ''}">
        <div class="text-xs text-gray-600 space-y-2">
          <div><strong>Session:</strong> ${esc(primary.session_name)}</div>
          ${roundLabel}
          <div class="mt-3"><strong>All Competitors:</strong><div class="ml-2 mt-1">${renderHeatDetails(allRounds)}</div></div>
        </div>
      </div>
    </div>`;
  }

  // ── All-heats view (no competitor selected) ────────────────────────────────
  // The next upcoming physical heat's key, or null once they're all done. Cheap
  // enough to call on the refresh tick to decide whether a re-render is needed.
  function allHeatsNextKey() {
    const now = new Date();
    for (const part of allPhysicalHeats)
      if (new Date(part[0].time) > now) return part[0].key;
    return null;
  }

  function generateAllHeatsSchedule() {
    if (!heatsData) return;
    showingAllHeats = true;

    // Reuse the partition already computed at load, rather than re-partitioning
    // the full heat set on every (10s-polled) render.
    const uniqueHeats = allPhysicalHeats.map(part => part[0]);

    document.getElementById('participantName').textContent = 'All Heats';
    document.getElementById('heatCount').textContent = `Heat Schedule • ${uniqueHeats.length} heats`;
    document.getElementById('contestedStatsBox').classList.add('hidden');

    const sessions = groupHeatsBySession(uniqueHeats);
    currentSessions = sessions;
    const nextHeatKey = allHeatsNextKey();
    lastAllHeatsNextKey = nextHeatKey;

    let html = '';
    sessions.forEach((sessionHeats, si) => {
      const first = sessionHeats[0];
      const last  = sessionHeats[sessionHeats.length - 1];
      const sessionType = first.session_name || getSessionType(first.time);

      html += `<div id="session-${si}" class="blue-box">
        <div class="text-sm">${esc(sessionType)} • ${esc(formatTime(first.time))}–${esc(formatTime(last.time))}</div>
        <div class="font-semibold">${sessionHeats.length} heats</div>
      </div>`;

      groupHeatsByHeatNumber(sessionHeats).forEach(group => {
        const allRounds = getHeatRounds(group[0].heat_number, group[0].session, group);
        const primary = allRounds[0];

        if (group.some(h => h.key === nextHeatKey))
          html += `<div id="nextHeatMarker" class="next-marker">⬇️ Next heat ${esc(primary.heat_number)}</div>`;
        html += renderHeatCard(primary, allRounds, group[0].entries[0]?.event || '');
      });
    });

    if (!nextHeatKey && uniqueHeats.length > 0)
      html += '<div id="allDoneMarker" class="done-marker">✅ All done!</div>';

    setScheduleHTML(html || '<p class="text-gray-500 text-center">No heats in this competition</p>');
  }

  // ── Competitor schedule ────────────────────────────────────────────────────
  function generateSchedule() {
    if (!selectedCompetitor || !heatsData) return;

    document.getElementById('participantName').textContent = selectedCompetitor;

    const myHeatKeys = heatsData.competitor_heats[selectedCompetitor] || [];
    const myHeats = myHeatKeys.map(k => heatsByKey[k]).filter(Boolean);
    myHeats.sort((a, b) => new Date(a.time) - new Date(b.time));

    const studio = heatsData.competitor_studios[selectedCompetitor];
    document.getElementById('heatCount').innerHTML = studio
      ? `<span class="text-gray-500">${esc(studio)}</span> • ${myHeats.length} heats`
      : `Heat Schedule • ${myHeats.length} heats`;

    const nextIdx = findNextHeatPosition(myHeats);
    const sessions = groupHeatsBySession(myHeats);
    currentSessions = sessions;

    // Chronological blocks covering every session in the competition: sessions
    // this competitor dances in render heats as usual; sessions they sit out
    // still render if the program has a "top" ceremony (top student/teacher/
    // studio, etc.) — those are always shown regardless of who's searched.
    const blocks = Object.keys(heatsData.sessions || {}).map(code => {
      const attended = sessions.find(s => s[0].session === code);
      if (attended) return { kind: 'session', heats: attended };
      const tops = (programMarkers?.bySession?.[code]?.activities || []).filter(a => a.category === 'top');
      return tops.length ? { kind: 'topOnly', code, activities: tops } : null;
    }).filter(Boolean);

    let html = '';
    let si = 0;
    blocks.forEach((block, bi) => {
      if (block.kind === 'topOnly') {
        html += `<div class="blue-box"><div class="text-sm">${esc(heatsData.sessions[block.code])}</div></div>`;
        block.activities.forEach(a => { html += renderProgramActivity(a); });
        return;
      }

      const sessionHeats = block.heats;
      const code = sessionHeats[0].session;
      const acts = programMarkers?.bySession?.[code]?.activities || [];
      let actIdx = 0;

      const first = sessionHeats[0];
      const last  = sessionHeats[sessionHeats.length - 1];
      const sessionType = first.session_name || getSessionType(first.time);

      const partners = new Set();
      sessionHeats.forEach(h => { const p = getPartner(selectedCompetitor, h); if (p) partners.add(p); });
      const partnerText = partners.size ? Array.from(partners).join(', ') : 'Solo';

      const firstPartner = getPartner(selectedCompetitor, sessionHeats[0]);
      html += `<div id="session-${si}" class="blue-box">
        <div class="text-sm">${esc(sessionType)} • ${esc(formatTime(first.time))}–${esc(formatTime(last.time))}</div>
        <div class="font-semibold">${esc(partnerText)}</div>
      </div>`;
      si++;

      if (partners.size > 1 && firstPartner)
        html += `<div class="partner-change-marker">🔄 ${esc(firstPartner)}</div>`;

      let lastTime = null, lastKey = null, lastPartner = null, isFirstGroup = true;

      groupHeatsByHeatNumber(sessionHeats).forEach(group => {
        const allRounds = getHeatRounds(group[0].heat_number, group[0].session, group);
        const primary = allRounds[0];
        const main = allRounds[allRounds.length - 1];

        const pending = [];
        while (actIdx < acts.length && acts[actIdx].time <= primary.time) {
          pending.push(acts[actIdx]);
          actIdx++;
        }
        if (isFirstGroup) {
          // Same backlog problem as the trailing case, mirrored: this
          // competitor's block can start well after the session's actual
          // first heat, so `pending` may hold hours of other people's award
          // notices. Keep only what follows the last one — typically just an
          // immediately-preceding costume break.
          // 'top' ceremonies are always relevant regardless of position, so
          // they're never trimmed — only stale 'award'/'break' noise before
          // the most recent 'award' gets dropped.
          let lastAwardIdx = -1;
          pending.forEach((a, i) => { if (a.category === 'award') lastAwardIdx = i; });
          pending.forEach((a, i) => {
            if (a.category === 'top' || i > lastAwardIdx) html += renderProgramActivity(a);
          });
          // "First heat" is normally the session's actual first heat (useful
          // for grabbing a table before the floor gets busy). But if this
          // competitor's own block starts well after a break/award — i.e.
          // `pending` wasn't empty — that session-wide time is stale/unrelated
          // noise, so fall back to their own first heat instead, which is the
          // heat right after whatever just happened.
          const firstHeatTime = pending.length === 0 ? (sessionFirstHeatTime[code] || primary.time) : primary.time;
          html += `<div class="break-marker">▶️ First heat ${esc(formatTime(firstHeatTime))}</div>`;
          isFirstGroup = false;
        } else {
          pending.forEach(a => { html += renderProgramActivity(a); });
        }

        const myEntry = group.reduce(
          (found, h) => found || h.entries.find(e => e.competitor1 === selectedCompetitor || e.competitor2 === selectedCompetitor),
          null
        );
        const myEvent = myEntry?.event || '';
        const currentPartner = group.reduce((found, h) => found || getPartner(selectedCompetitor, h), null);

        if (lastTime !== null)
          html += transitionMarker(lastKey, lastTime, primary, currentPartner, currentPartner !== lastPartner);

        if (group.some(h => myHeats.indexOf(h) === nextIdx))
          html += `<div id="nextHeatMarker" class="next-marker">⬇️ Next heat ${esc(primary.heat_number)}</div>`;

        const isContested = main.entries.some(e =>
          e.event === myEvent &&
          e.competitor1 !== selectedCompetitor &&
          e.competitor2 !== selectedCompetitor
        );
        const mainMyEntry = main.entries.find(e => e.competitor1 === selectedCompetitor || e.competitor2 === selectedCompetitor) || myEntry;
        const groupKey = allRounds.map(h => h.key).join('-');
        const contestedBadge = isContested
          ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 ml-2 cursor-pointer hover:underline" onclick="toggleJudgesPanel(event, '${esc(groupKey)}', '${esc(selectedCompetitor)}', '${esc(primary.heat_number)}')">${contestedLabel(mainMyEntry?.result)}</span>`
          : '';
        const judgesPanel = isContested ? renderJudgesPanel(groupKey) : '';

        html += renderHeatCard(primary, allRounds, myEvent, contestedBadge, judgesPanel);

        lastTime = main.time;
        lastKey = primary.key;
        lastPartner = currentPartner;
      });

      // Past this competitor's last heat of the session, only the notice
      // covering *that* heat is relevant (typically a costume break followed
      // by the award for it) — later activities belong to other heats this
      // competitor has no stake in, so stop after the first award. 'top'
      // ceremonies are always relevant, though, so they never stop the flush
      // and keep showing even when they land right after that award (e.g.
      // "Awards" then "Ca Star Ball Top Awards" back to back).
      let sawAward = false;
      while (actIdx < acts.length) {
        const a = acts[actIdx];
        actIdx++;
        if (a.category !== 'top' && sawAward) continue;
        html += renderProgramActivity(a);
        if (a.category === 'award') sawAward = true;
      }

      const nextBlock = blocks[bi + 1];
      if (nextBlock && nextBlock.kind === 'session') {
        const nextFirst = nextBlock.heats[0];
        if (new Date(last.time).toDateString() === new Date(nextFirst.time).toDateString()) {
          const rest = restMinutes(last.time, nextFirst.time);
          if (rest > 0)
            html += `<div class="break-marker">⏸️ Break · ${formatBreakTime(Math.round(rest))} rest</div>`;
        }
      }
    });

    if (nextIdx === -1 && myHeats.length > 0)
      html += '<div id="allDoneMarker" class="done-marker">✅ All done!</div>';

    setScheduleHTML(html || '<p class="text-gray-500 text-center">No heats found for this competitor</p>');
    populateContestedStats();
  }

  // ── Contested stats (heats tab) ────────────────────────────────────────────
  function toggleContestedStats() {
    const details = document.getElementById('contestedStatsDetails');
    if (!details) return;
    details.classList.toggle('expanded');
    if (details.classList.contains('expanded')) populateContestedStats();
  }

  function populateContestedStats() {
    if (!selectedCompetitor || !heatsData) return;
    const list = document.getElementById('contestedStatsList');
    const stats = computeContestedStats(selectedCompetitor).slice(0, 10);
    list.innerHTML = renderContestedStatsHtml(stats);
    const avg = avgScores[selectedCompetitor];
    document.getElementById('contestedAvgScore').textContent =
      avg != null ? `Wins ${Math.round(avg * 100)}%` : '';
  }

  // ── Ranking ────────────────────────────────────────────────────────────────
  function buildRankingSuggestions() {
    if (!rankingData) return;
    const names = new Set(allCompetitorNames);
    (rankingData.couples || []).forEach(c => {
      if (c.studio) names.add(c.studio);
    });
    buildSuggestions('ranking-suggestions', [...names].sort());
  }

  document.getElementById('search-ranking').addEventListener('input', e => {
    const val = e.target.value.trim() || null;
    if (val !== getCompetitorParam()) setCompetitorParam(val);
    renderRanking();
  });

  function buildCoupleMap() {
    const map = {};
    (rankingData.couples || []).forEach(c => { map[coupleKey(c.competitor, c.partner)] = c; });
    return map;
  }

  function renderCoupleRow(c) {
    const dc = c.elo_delta.startsWith('+') ? 'delta-pos' : c.elo_delta.startsWith('-') ? 'delta-neg' : '';
    const avg = avgScoresByCouple[coupleKey(c.competitor, c.partner)];
    const avgStr = avg != null ? Math.round(avg * 100) + '%' : '—';
    const delta = c.elo_delta.replace(/\.\d+$/, '');
    return `<tr>
      <td>${c.rank}</td>
      <td>${esc(c.competitor)}${c.partner ? ' &amp; ' + esc(c.partner) : ''}</td>
      <td>${esc(c.studio)}</td>
      <td>${Math.round(c.elo)}</td>
      <td class="${dc}">${esc(delta)}</td>
      <td>${avgStr}</td>
    </tr>`;
  }

  function renderRanking() {
    if (!rankingData) return;
    const raw = document.getElementById('search-ranking').value.trim();
    const query = raw.toLowerCase();
    const bibNames = /^\d+$/.test(raw) ? (bibToNames[raw] ?? null) : null;

    const predicate = bibNames
      ? c => bibNames.has(c.competitor) || bibNames.has(c.partner)
      : query
        ? c => c.competitor.toLowerCase().includes(query) ||
               (c.partner || '').toLowerCase().includes(query) ||
               (c.studio || '').toLowerCase().includes(query)
        : () => true;

    const couples = (rankingData.couples || []).filter(predicate);

    let html = '';
    if (couples.length) {
      const displayMap = new Map();
      couples.forEach(c => displayMap.set(coupleKey(c.competitor, c.partner), c));
      if (query && heatsData) {
        couples.forEach(c => {
          computeContestedStats(c.competitor, c.partner || null).forEach(opp => {
            const entry = coupleMap[coupleKey(opp.competitor1, opp.competitor2)];
            if (!entry) return;
            const key = coupleKey(entry.competitor, entry.partner);
            if (!displayMap.has(key)) displayMap.set(key, entry);
          });
        });
      }
      const rows = [...displayMap.values()]
        .sort((a, b) => a.rank - b.rank)
        .map(renderCoupleRow).join('');

      html = `<div class="lb-section">
        <div style="overflow-x:auto">
          <table class="lb-table">
            <thead><tr><th>#</th><th>Couple</th><th>Studio</th><th>ELO</th><th>Δ</th><th>Wins</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }

    if (!html && raw && !bibNames && allCompetitorNames.includes(raw)) {
      const compName = compList[activeCompIdx]?.short_name || compList[activeCompIdx]?.name || 'this competition';
      const otherComps = compList
        .map((c, i) => ({ comp: c, i }))
        .filter(({ comp, i }) => i !== activeCompIdx && comp.competitors?.includes(raw));
      html = `<p class="text-gray-500 text-center">${esc(raw)} is not competing in ${esc(compName)}</p>`;
      if (otherComps.length) {
        html += `<p class="text-gray-400 text-center text-sm mt-2">Competed at: ${
          otherComps.map(({ comp, i }) =>
            `<span class="cursor-pointer text-indigo-500 hover:underline" onclick="selectComp(${i})">${esc(comp.short_name || comp.name)}</span>`
          ).join(', ')
        }</p>`;
      }
    }

    rankingView.innerHTML = html;
  }

  function renderActive() {
    if (activeTab === 'ranking') renderRanking();
  }

  // ── Navigator ──────────────────────────────────────────────────────────────
  function toggleNavigator() {
    const menu = document.getElementById('navigator-menu');
    if (!menu) return;
    const isOpen = !menu.classList.contains('hidden');
    if (isOpen) { menu.classList.add('hidden'); return; }

    let html = `<div onclick="navigateTo('top')">⬆️ Top</div>`;
    html += `<div onclick="navigateTo('current')">⬇️ Current heat</div>`;
    currentSessions.forEach((sessionHeats, si) => {
      const first = sessionHeats[0];
      const label = first.session_name || getSessionType(first.time);
      html += `<div onclick="navigateTo('session-${si}')">${esc(label)}</div>`;
    });
    document.getElementById('navigator-items').innerHTML = html;
    menu.classList.remove('hidden');
  }

  function navigateTo(target) {
    document.getElementById('navigator-menu')?.classList.add('hidden');
    if (target === 'top') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (target === 'current') {
      const marker = document.getElementById('nextHeatMarker') || document.getElementById('allDoneMarker');
      if (marker) marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      const el = document.getElementById(target);
      if (el) {
        const header = document.getElementById('heats-controls');
        const offset = header ? header.offsetHeight : 0;
        const top = el.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function getPartner(competitor, heat) {
    const e = heat.entries.find(e => e.competitor1 === competitor || e.competitor2 === competitor);
    if (!e) return null;
    return e.competitor1 === competitor ? e.competitor2 : e.competitor1;
  }

  function findNextHeatPosition(heats) {
    const now = new Date();
    return heats.findIndex(h => new Date(h.time) > now);
  }

  function groupHeatsByHeatNumber(sessionHeats) {
    const groups = [];
    sessionHeats.forEach(heat => {
      const prev = groups[groups.length - 1];
      if (prev && prev[0].heat_number === heat.heat_number) prev.push(heat);
      else groups.push([heat]);
    });
    return groups;
  }

  function groupHeatsBySession(heats) {
    const sessions = [];
    let cur = [], curId = null;
    heats.forEach(h => {
      if (h.session !== curId) { if (cur.length) sessions.push(cur); cur = [h]; curId = h.session; }
      else cur.push(h);
    });
    if (cur.length) sessions.push(cur);
    return sessions;
  }

  function collectUniqueHeats(keys) {
    const heats = [];
    const seen = new Set();
    for (const k of keys) {
      if (seen.has(k)) continue;   // studio members can share a heat → same key twice
      seen.add(k);
      const heat = heatsByKey[k];
      if (heat) heats.push(heat);
    }
    return dedupePhysicalHeats(heats);
  }

  function getSessionType(t) {
    const h = new Date(t).getHours();
    return h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
  }

  function toggleHeatDetails(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('expanded');
    const key = id.slice(2);
    el.classList.contains('expanded') ? expandedHeats.add(key) : expandedHeats.delete(key);
  }

  // Lazy-loads and toggles the live judges-scores panel under a Contested pill.
  // Always fetched live (never cached to disk) via judges-scores.js — but the
  // resolved data IS kept in judgesDataCache (in memory only) for the rest of
  // the session, since the 10s auto-refresh rebuilds this DOM node from scratch
  // and would otherwise silently collapse/re-fetch an open panel every tick.
  async function toggleJudgesPanel(event, key, competitorName, heatNumber) {
    event.stopPropagation();
    const el = document.getElementById('jp-' + key);
    if (!el) return;
    const isOpen = el.classList.toggle('expanded');
    isOpen ? expandedJudgesPanels.add(key) : expandedJudgesPanels.delete(key);
    if (!isOpen) return;
    if (judgesDataCache[key]) {
      el.innerHTML = buildJudgesPanelContent(key);
      return;
    }

    el.innerHTML = '<div class="text-xs text-gray-500 p-2">Loading judges scores…</div>';
    try {
      const cyi = heatsData.meta.cyi;
      const eventData = await JudgesScores.fetchJudgesData(cyi, competitorName, heatNumber);
      judgesDataCache[key] = { data: eventData };
      el.innerHTML = buildJudgesPanelContent(key);
    } catch (err) {
      el.innerHTML = `<div class="text-xs text-red-600 p-2">Couldn't load judges scores: ${esc(err.message)}</div>`;
    }
  }

  function formatDate(s) {
    const d = new Date(s);
    const day = String(d.getDate()).padStart(2, '0');
    const mon = String(d.getMonth() + 1).padStart(2, '0');
    return `${ ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()] } ${mon}/${day}`;
  }

  function formatTime(s) {
    const d = new Date(s);
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return `${h}:${m} ${ap}`;
  }

  function formatBreakTime(mins) {
    if (mins >= 60) {
      const h = Math.floor(mins / 60), q = Math.floor((mins % 60) / 15);
      return h + ['', '¼', '½', '¾'][q] + ' hr';
    }
    if (mins >= 45) return '¾ hr';
    if (mins > 15) return `${Math.floor(mins / 5) * 5} min`;
    return `${mins} min`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const ORDINAL_SFX = ['th','st','nd','rd','th'];
  function ordinal(n) {
    const v = n % 100;
    return n + (v >= 11 && v <= 13 ? 'th' : ORDINAL_SFX[Math.min(n % 10, 4)]);
  }

  function rankPrefix(r) {
    return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : null;
  }

  function contestedLabel(result) {
    const r = parseInt(result);
    if (isNaN(r)) return 'Contested';
    const medal = rankPrefix(r);
    return medal ? `${medal} Contested` : `${ordinal(r)} Contested`;
  }

  // ── ELO tab ────────────────────────────────────────────────────────────────
  const ELO_SCALE          = /*[[ELO_SCALE]]*/ 400;
  const PARTNER_WEIGHT_BASE = /*[[PARTNER_WEIGHT_BASE]]*/ 0.20;
  const ELO_COLORS = ['#6366f1','#ef4444','#22c55e','#f97316','#a855f7','#14b8a6'];

  function computeCoupleElo(r_a, r_b) {
    // Mirror of ranking/elo.py _compute_shares + blended rating.
    // logistic > 0.5 when r_b < r_a (b is weaker), giving b the larger share.
    const logistic = 1 / (1 + Math.pow(10, (r_b - r_a) / ELO_SCALE));
    const w_b = logistic * (1 - 2 * PARTNER_WEIGHT_BASE) + PARTNER_WEIGHT_BASE;
    return (1 - w_b) * r_a + w_b * r_b;
  }

  function eloMakeKey(cyi, e) {
    return `${cyi}\x1f${e.event_name}\x1f${e.round_name}\x1f${e.dance_name}`;
  }

  function setEloStatus(msg) {
    const st = document.getElementById('elo-status');
    st.textContent = msg;
    st.classList.toggle('hidden', !msg);
  }

  function initEloTab() {
    if (!Object.keys(eloPartnerMap).length) buildEloSuggestions();
    if (eloSeries.length) { setEloStatus(''); renderEloChart(); }
    else setEloStatus('Add a competitor to see their ELO progression.');
  }

  // Suggestions come from the global competitor list (elo_ratings.json-backed,
  // already loaded into allCompetitorNames) rather than scanning ELO history —
  // that would require fetching every competition's history file up front.
  function buildEloSuggestions() {
    buildSuggestions('elo-suggestions', allCompetitorNames);
  }

  // Partner suggestions can only reflect competitions whose history file has
  // already been fetched (for some other series), so this list starts sparse
  // and fills in opportunistically as eloFetchCyi() runs. Accepted trade-off
  // of not wanting a whole extra data/elo_partners.json file.
  function updatePartnerSuggestions() {
    const a = document.getElementById('elo-search-a').value.trim();
    const partners = a && eloPartnerMap[a] ? [...eloPartnerMap[a]].sort() : [];
    buildSuggestions('elo-partner-suggestions', partners);
  }

  function eloCandidateCyis(names) {
    return compList
      .filter(c => (c.competitors || []).some(n => names.includes(n)))
      .map(c => String(c.cyi));
  }

  function eloFetchCyi(cyi) {
    if (eloHistoryByCyi[cyi]) return Promise.resolve(eloHistoryByCyi[cyi]);
    if (eloHistoryFetching[cyi]) return eloHistoryFetching[cyi];
    const p = fetch(`data/elo_history/${cyi}.json`)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        eloHistoryByCyi[cyi] = data;
        delete eloHistoryFetching[cyi];
        for (const e of data) {
          if (e.partner) {
            (eloPartnerMap[e.competitor] ??= new Set()).add(e.partner);
            (eloPartnerMap[e.partner]    ??= new Set()).add(e.competitor);
          }
        }
        return data;
      })
      .catch(err => { delete eloHistoryFetching[cyi]; throw err; });
    eloHistoryFetching[cyi] = p;
    return p;
  }

  function eloAddByName(name) {
    if (!name || eloSeries.length >= 5) return;
    if (eloSeries.some(s => s.name === name)) return;
    const names = name.includes(' & ') ? name.split(' & ', 2).map(s => s.trim()) : [name];
    const cyis = eloCandidateCyis(names);
    if (!cyis.length) { setEloStatus(`"${name}" not found in ELO history.`); return; }
    setEloStatus('Loading…');
    Promise.all(cyis.map(eloFetchCyi))
      .then(() => {
        const series = eloExtractSeries(name);
        if (!series) { setEloStatus(`"${name}" not found in ELO history.`); return; }
        setEloStatus('');
        series.color = ELO_COLORS[eloSeries.length % ELO_COLORS.length];
        eloSeries.push(series);
        renderEloChips();
        renderEloChart();
      })
      .catch(err => setEloStatus(`Failed to load ELO history: ${err.message}`));
  }

  function eloAddContestant() {
    const input = document.getElementById('elo-search-a');
    const name = input.value.trim();
    if (!name) return;
    eloAddByName(name);
    input.value = '';
  }

  function eloAddCouple() {
    const inputA = document.getElementById('elo-search-a');
    const inputB = document.getElementById('elo-search-b');
    const a = inputA.value.trim();
    const b = inputB.value.trim();
    if (!a || !b) return;
    eloAddByName(`${a} & ${b}`);
    inputB.value = '';
  }

  function eloRemoveSeries(name) {
    eloSeries = eloSeries.filter(s => s.name !== name);
    renderEloChips();
    if (!eloSeries.length) {
      if (eloChart) { eloChart.destroy(); eloChart = null; _eloBoundaries = []; _eloN = 0; }
      document.getElementById('elo-chart-wrap').classList.add('hidden');
      setEloStatus('Add a competitor to see their ELO progression.');
    } else {
      renderEloChart();
    }
  }

  function renderEloChips() {
    document.getElementById('elo-series-list').innerHTML = eloSeries.map(s =>
      `<span class="elo-series-chip" style="background:${esc(s.color)}">
         ${esc(s.name)}
         <button onclick="eloRemoveSeries(${esc(JSON.stringify(s.name))})" aria-label="Remove">×</button>
       </span>`
    ).join('');
  }

  function eloSortedCyiPairs() {
    const dates = {};
    for (const c of compList) dates[String(c.cyi)] = c.start_date || '';
    return Object.entries(eloHistoryByCyi).sort(([a], [b]) => (dates[a] || '').localeCompare(dates[b] || ''));
  }

  function eloExtractSeries(name) {
    const couple = name.includes(' & ') ? name.split(' & ', 2).map(s => s.trim()) : null;

    if (couple) {
      const [a, b] = couple;
      const entries_a = new Map(), entries_b = new Map();
      let initial_a = null, initial_b = null;
      for (const [cyi, heats] of eloSortedCyiPairs()) {
        for (const e of heats) {
          if (e.competitor === a) {
            if (initial_a === null) initial_a = e.elo_before;
            entries_a.set(eloMakeKey(cyi, e), e);
          } else if (e.competitor === b) {
            if (initial_b === null) initial_b = e.elo_before;
            entries_b.set(eloMakeKey(cyi, e), e);
          }
        }
      }
      if (initial_a === null && initial_b === null) return null;
      initial_a ??= 1500;
      initial_b ??= 1500;
      return { name, isCouple: true, memberA: a, memberB: b,
               entries_a, entries_b, initial_a, initial_b,
               initial: computeCoupleElo(initial_a, initial_b) };
    }

    const entries = new Map();
    let initial = null;
    for (const [cyi, heats] of eloSortedCyiPairs()) {
      for (const e of heats) {
        if (e.competitor !== name) continue;
        if (initial === null) initial = e.elo_before;
        entries.set(eloMakeKey(cyi, e), e);
      }
    }
    if (initial === null) return null;
    return { name, entries, initial };
  }

  function eloGlobalTimeline() {
    const participating = new Set();
    for (const s of eloSeries) {
      if (s.isCouple) {
        for (const k of s.entries_a.keys()) participating.add(k);
        for (const k of s.entries_b.keys()) participating.add(k);
      } else {
        for (const k of s.entries.keys()) participating.add(k);
      }
    }
    const seen = new Set();
    const timeline = [];
    const boundaries = [];
    let prevCyi = null;
    for (const [cyi, heats] of eloSortedCyiPairs()) {
      for (const e of heats) {
        const key = eloMakeKey(cyi, e);
        if (seen.has(key) || !participating.has(key)) continue;
        seen.add(key);
        if (cyi !== prevCyi) { boundaries.push({ idx: timeline.length, cyi }); prevCyi = cyi; }
        timeline.push({ key, cyi, eventName: e.event_name, roundName: e.round_name, danceName: e.dance_name });
      }
    }
    return { timeline, boundaries };
  }

  function eloAlignSeries(series, timeline) {
    if (series.isCouple) {
      let r_a = series.initial_a, r_b = series.initial_b;
      const yValues = [computeCoupleElo(r_a, r_b)];
      const tooltipData = [];
      for (const { key } of timeline) {
        const ea = series.entries_a.get(key);
        const eb = series.entries_b.get(key);
        if (ea) r_a = ea.elo_after;
        if (eb) r_b = eb.elo_after;
        yValues.push(computeCoupleElo(r_a, r_b));
        tooltipData.push(ea || eb || null);
      }
      return { yValues, tooltipData };
    }

    let elo = series.initial;
    const yValues = [elo];
    const tooltipData = [];
    for (const { key } of timeline) {
      const entry = series.entries.get(key);
      if (entry) elo = entry.elo_after;
      yValues.push(elo);
      tooltipData.push(entry);
    }
    return { yValues, tooltipData };
  }

  function renderEloChart() {
    if (!eloSeries.length) return;
    const { timeline, boundaries } = eloGlobalTimeline();
    if (!timeline.length) return;

    _cyiNameMap = {};
    for (const c of compList) _cyiNameMap[String(c.cyi)] = c.short_name || c.name;

    const N = timeline.length;
    const aligned = eloSeries.map(s => eloAlignSeries(s, timeline));
    const allY = aligned.flatMap(a => a.yValues);
    const yMin = Math.min(...allY), yMax = Math.max(...allY);
    const pad = Math.max(10, (yMax - yMin) * 0.05);

    _eloBoundaries = boundaries;
    _eloN = N;

    const coupleStyle = { borderDash: [5, 5], stepped: false, tension: 0.3 };
    const soloStyle   = { borderDash: [],     stepped: 'after', tension: 0 };
    const datasets = eloSeries.map((s, i) => ({
      label: s.name,
      data: aligned[i].yValues,
      borderColor: s.color,
      borderWidth: 2,
      pointRadius: 0,
      pointHoverRadius: 5,
      fill: false,
      ...(s.isCouple ? coupleStyle : soloStyle),
    }));

    const cfg = {
      type: 'line',
      data: { labels: Array.from({ length: N+1 }, (_, i) => i), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: { type: 'linear', min: 0, max: N,
               title: { display: true, text: 'dance #' },
               ticks: { maxTicksLimit: 10, callback: v => Number.isInteger(v) ? v : '' } },
          y: { min: yMin - pad, max: yMax + pad * 3,
               title: { display: true, text: 'ELO Ranking' },
               ticks: { callback: v => Math.round(v) } },
        },
        plugins: {
          legend: { position: 'top' },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              title(items) {
                const idx = items[0]?.dataIndex;
                if (idx === 0) return 'Starting ELO';
                const h = timeline[idx - 1];
                return h ? `${h.danceName} — ${h.roundName}` : '';
              },
              label(item) {
                const s     = eloSeries[item.datasetIndex];
                const idx   = item.dataIndex;
                const entry = idx > 0 ? aligned[item.datasetIndex].tooltipData[idx-1] : null;
                const elo   = Math.round(item.raw);
                if (!entry) return `${s.name}: ${elo}`;
                const delta = entry.elo_after - entry.elo_before;
                return `${s.name}: ${elo} (${delta >= 0 ? '+' : ''}${delta.toFixed(1)})`;
              },
              afterLabel(item) {
                const idx = item.dataIndex;
                if (idx === 0) return '';
                const entry = aligned[item.datasetIndex].tooltipData[idx-1];
                return entry ? entry.event_name : '';
              },
            },
          },
        },
      },
    };

    document.getElementById('elo-chart-wrap').classList.remove('hidden');
    const canvas = document.getElementById('elo-canvas');
    if (eloChart) {
      eloChart.data = cfg.data;
      eloChart.options = cfg.options;
      eloChart.update('none');
    } else {
      eloChart = new Chart(canvas, cfg);
    }
    window.__eloChart = eloChart;
  }

  document.getElementById('elo-search-a').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); eloAddContestant(); }
  });
  document.getElementById('elo-search-a').addEventListener('input', updatePartnerSuggestions);
  document.getElementById('elo-search-b').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); eloAddCouple(); }
  });

  document.querySelectorAll('.search-wrap').forEach(wrap => {
    const input = wrap.querySelector('input[type=search]');
    const btn   = wrap.querySelector('.search-clear');
    if (!input || !btn) return;
    btn.addEventListener('click', () => { input.value = ''; input.dispatchEvent(new Event('input')); input.focus(); });
  });

  // Tracks whether a touch/scroll gesture is in progress, so the periodic
  // rebuild below can skip a tick rather than yank a rebuilt DOM out from
  // under an in-flight scroll (which aborts momentum scrolling on mobile and
  // resets any element mid-gesture, e.g. a horizontally-scrolled table).
  let touchInProgress = false;
  document.addEventListener('touchstart', () => { touchInProgress = true; }, { passive: true });
  document.addEventListener('touchend', () => { touchInProgress = false; }, { passive: true });

  // Auto-refresh during live competition — advances the "next heat" marker as heats finish
  function renderCurrentHeatsView() {
    if (!heatsData) return;
    if (!selectedCompetitor) {
      // Only refresh the actual All-Heats view — not the "not competing" placeholder —
      // and only when the next heat has actually advanced (avoids a full DOM rebuild each tick).
      if (showingAllHeats && allHeatsNextKey() !== lastAllHeatsNextKey) generateAllHeatsSchedule();
    }
    else if (heatsData.studios?.includes(selectedCompetitor)) generateStudioSchedule();
    else if (bibHeats[selectedCompetitor]) generateBibSchedule(selectedCompetitor);
    else generateSchedule();
  }
  setInterval(() => {
    if (!heatsData) return;
    if (touchInProgress) return;
    if (document.activeElement?.id === 'competitorSearch') return;
    renderCurrentHeatsView();
  }, 10000);
</script>
<script src="judges-scores.js"></script>
<script src="program.js"></script>
</body>
